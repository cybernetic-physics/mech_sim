[feedback]
public_metrics = ["mobility.observed", "stack.observed", "stack.expected"]
hidden_metrics = ["stack.error_pct"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 0
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["base_face", "stack_top"]
hard_gate = true
severity = "critical"
require_grounded = ["base_face"]

[[probes]]
id = "stack"
type = "analytic_param_check"
path = "params.declared_stack_height_mm"
expected = 15.726
comparator = "eq"
failure_code = "wrong_ratio"
weight = 1.0
severity = "major"
hard_gate = false
tolerance_pct = 2.0
