[feedback]
public_metrics = ["mobility.observed", "bcd.observed", "bcd.expected", "bolt_count.observed", "bolt_count.expected"]
hidden_metrics = ["bcd.error_pct"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 0
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["flange_axis", "bolt_ref"]
hard_gate = true
severity = "critical"
require_grounded = ["flange_axis"]

[[probes]]
id = "bcd"
type = "analytic_param_check"
path = "params.declared_bolt_circle_mm"
expected = 105.111
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.7
severity = "major"
hard_gate = false
tolerance_pct = 1.0

[[probes]]
id = "bolt_count"
type = "analytic_param_check"
path = "params.declared_bolt_count"
expected = 4.0
comparator = "eq"
failure_code = "invalid_artifact"
weight = 0.3
severity = "major"
hard_gate = false
