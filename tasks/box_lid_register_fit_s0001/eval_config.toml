[feedback]
public_metrics = ["clearance_lo.observed", "clearance_hi.observed"]
hidden_metrics = ["clearance_lo.error_abs"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 0
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["base_frame", "lid_frame"]
hard_gate = true
severity = "critical"
require_grounded = ["base_frame"]

[[probes]]
id = "clearance_lo"
type = "analytic_param_check"
path = "params.register_clearance_mm"
expected = 0.05
comparator = "ge"
failure_code = "insufficient_clearance"
weight = 0.5
severity = "major"
hard_gate = false

[[probes]]
id = "clearance_hi"
type = "analytic_param_check"
path = "params.register_clearance_mm"
expected = 0.5
comparator = "le"
failure_code = "insufficient_clearance"
weight = 0.5
severity = "major"
hard_gate = false
