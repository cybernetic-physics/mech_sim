[feedback]
public_metrics = ["contact.contact.gear1:gear2.rms_N", "torque.output_speed_observed_rad_s", "ratio_obs.ratio_observed"]
hidden_metrics = []

[hard_gate]
require = ["ports", "contact"]

[adapters.fake_contact_oracle]
enabled = true
contact_pairs = ["gear1:gear2"]
contact_force_N = 5.0
penetration_mm = 0.01
samples = 360
duration_s = 1.0
input_speed_rad_s = 1.0
output_load_Nm = 0.0
torque_ripple_pct = 5.0
power_balance_error_pct = 1.0
lockup = false
contact_engagement_fraction = 0.9
ratio_observed = 2.0

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[[probes]]
id = "contact"
type = "contact_engagement"
required_pairs = ["gear1:gear2"]
min_rms_force_N = 0.5
min_engagement_fraction = 0.2
weight = 0.5
severity = "critical"
hard_gate = true
adapter = "fake_contact_oracle"

[[probes]]
id = "torque"
type = "torque_load_trial"
input_port = "input_port"
output_port = "output_port"
input_speed_rad_s = 1.0
output_load_Nm = 0.05
min_output_speed_rad_s = 0.001
weight = 0.3
severity = "major"
adapter = "fake_contact_oracle"

[[probes]]
id = "ratio_obs"
type = "port_velocity_ratio"
input_port = "input_port"
output_port = "output_port"
expected = 0.5
tolerance_pct = 10.0
weight = 0.2
severity = "major"
adapter = "fake_contact_oracle"
