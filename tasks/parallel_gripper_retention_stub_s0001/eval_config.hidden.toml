[feedback]
public_metrics = ["ports.ports_required", "contact.contact.finger:object.rms_N", "retention.observed"]
hidden_metrics = []

[hard_gate]
require = ["ports", "contact"]

[adapters.fake_contact_oracle]
enabled = true
contact_pairs = ["finger:object"]
contact_force_N = 6.0
penetration_mm = 0.005
samples = 360
duration_s = 1.0
input_speed_rad_s = 1.0
output_load_Nm = 0.0
torque_ripple_pct = 5.0
power_balance_error_pct = 1.0
lockup = false
contact_engagement_fraction = 0.95

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port"]

[[probes]]
id = "contact"
type = "contact_engagement"
required_pairs = ["finger:object"]
min_rms_force_N = 0.5
min_engagement_fraction = 0.2
weight = 1.0
severity = "critical"
hard_gate = true
adapter = "fake_contact_oracle"

[[probes]]
id = "retention"
type = "analytic_param_check"
path = "params.retention_force_N"
expected = 24.574
comparator = "ge"
failure_code = "insufficient_clearance"
weight = 0.5
severity = "major"
hard_gate = false
