[feedback]
public_metrics = ["ports.ports_required", "contact.contact.plate_in:plate_out.rms_N"]
hidden_metrics = []

[hard_gate]
require = ["ports", "contact"]

[adapters.fake_contact_oracle]
enabled = true
contact_pairs = ["plate_in:plate_out"]
contact_force_N = 6.0
penetration_mm = 0.005
samples = 360
duration_s = 1.0
input_speed_rad_s = 1.0
output_load_Nm = 0.0
torque_ripple_pct = 5.0
power_balance_error_pct = 1.0
lockup = false
contact_engagement_fraction = 0.95

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port"]

[[probes]]
id = "contact"
type = "contact_engagement"
required_pairs = ["plate_in:plate_out"]
min_rms_force_N = 0.5
min_engagement_fraction = 0.2
weight = 1.0
severity = "critical"
hard_gate = true
adapter = "fake_contact_oracle"

[[probes]]
id = "torque"
type = "torque_load_trial"
input_port = "input_port"
output_port = "output_port"
input_speed_rad_s = 1.0
output_load_Nm = 0.05
min_output_speed_rad_s = 0.001
max_power_error_pct = 25.0
max_torque_ripple_pct = 30.0
weight = 0.5
severity = "major"
adapter = "fake_contact_oracle"
