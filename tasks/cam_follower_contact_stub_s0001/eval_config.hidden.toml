[feedback]
public_metrics = ["contact.contact.cam:follower.rms_N"]
hidden_metrics = []

[hard_gate]
require = ["ports", "contact"]

[adapters.fake_contact_oracle]
enabled = true
contact_pairs = ["cam:follower"]
contact_force_N = 8.0
penetration_mm = 0.01
samples = 360
duration_s = 1.0
input_speed_rad_s = 1.0
output_load_Nm = 0.0
torque_ripple_pct = 5.0
power_balance_error_pct = 1.0
lockup = false
contact_engagement_fraction = 0.9

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port"]

[[probes]]
id = "contact"
type = "contact_engagement"
required_pairs = ["cam:follower"]
min_rms_force_N = 0.5
min_engagement_fraction = 0.2
weight = 1.0
severity = "critical"
hard_gate = true
adapter = "fake_contact_oracle"

[[probes]]
id = "swept_collision"
type = "swept_collision"
max_penetration_mm = 0.05
weight = 0.5
severity = "major"
adapter = "fake_contact_oracle"

[[probes]]
id = "lockup"
type = "lockup"
input_port = "input_port"
output_port = "output_port"
min_output_motion_rad = 0.05
weight = 0.0
severity = "critical"
adapter = "fake_contact_oracle"
