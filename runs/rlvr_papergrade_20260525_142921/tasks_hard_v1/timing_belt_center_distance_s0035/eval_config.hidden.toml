[feedback]
public_metrics = ["belt_length.observed", "center.observed"]
hidden_metrics = ["belt_length.error_pct"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 2
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[[probes]]
id = "belt_length"
type = "analytic_param_check"
path = "params.declared_belt_length_mm"
expected = 240.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_pct = 1.0

[[probes]]
id = "center"
type = "analytic_param_check"
path = "params.declared_center_distance_mm"
expected = 100.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_pct = 1.0
