[feedback]
public_metrics = ["ratio.observed", "axis_angle.observed"]
hidden_metrics = []

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 2
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[[probes]]
id = "ratio"
type = "analytic_param_check"
path = "params.declared_ratio"
expected = 2.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.7
severity = "major"
hard_gate = false
tolerance_pct = 1.0

[[probes]]
id = "axis_angle"
type = "analytic_param_check"
path = "params.axis_angle_deg"
expected = 60.0
comparator = "eq"
failure_code = "wrong_topology"
weight = 0.3
severity = "major"
hard_gate = false
tolerance_abs = 1.0
