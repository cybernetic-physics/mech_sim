[feedback]
public_metrics = ["mobility.observed", "ports.ports_required", "ratio.observed", "ratio.expected"]
hidden_metrics = ["ratio.error_pct"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 2
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
require_grounded = ["input_port", "output_port"]
hard_gate = true
severity = "critical"

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "ratio"
type = "analytic_param_check"
path = "params.declared_ratio"
expected = 5.0
comparator = "eq"
tolerance_pct = 1.0
failure_code = "wrong_ratio"
weight = 1.0
severity = "major"
