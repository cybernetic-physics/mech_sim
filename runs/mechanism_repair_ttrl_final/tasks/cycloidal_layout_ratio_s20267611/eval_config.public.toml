[feedback]
public_metrics = ["mobility.observed", "mobility.expected", "ratio.observed", "ratio.expected", "pin_count.observed", "pin_count.expected"]
hidden_metrics = ["ratio.error_pct"]

[hard_gate]
require = ["mobility", "ports"]

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 3
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
require_grounded = ["input_port", "output_port"]
hard_gate = true
severity = "critical"

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "ratio"
type = "analytic_param_check"
path = "params.declared_ratio"
expected = 13.0
comparator = "eq"
tolerance_pct = 2.0
failure_code = "wrong_ratio"
weight = 0.7
severity = "major"

[[probes]]
id = "pin_count"
type = "analytic_param_check"
path = "params.ring_pin_count"
expected = 14.0
comparator = "eq"
failure_code = "wrong_topology"
weight = 0.3
severity = "major"
