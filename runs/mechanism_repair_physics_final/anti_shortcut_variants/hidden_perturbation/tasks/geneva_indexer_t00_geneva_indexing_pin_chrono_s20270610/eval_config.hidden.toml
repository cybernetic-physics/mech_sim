[feedback]
public_metrics = ["ports.ports_required", "contact.contact.driver:geneva.rms_N", "contact.contact.driver:geneva.engagement_fraction", "penetration_bound.max_penetration_mm", "lockup.output_motion_rad", "lockup.lockup_detected", "index_count.observed", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["contact.worst_pair_score", "lockup.output_velocity_max", "trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["ports", "contact", "penetration_bound", "lockup", "trusted_asset_preflight"]

[adapters.chrono_contact]
contact_model = "nsc"
procedural_cycloidal_fallback = false
collision_filter_named_pairs = true
samples = 501
duration_s = 0.8
dt = 0.0001
timestep = 0.0001
input_speed_rad_s = 8.0
friction_mu = 0.05
restitution = 0.0
contact_margin_m = 1e-05
contact_envelope_m = 5e-05
solver_iterations = 300
solver_max_iterations = 300
solver_tolerance = 1e-08
output_load_Nm = 0.05

[mechanism_repair_physics]
family = "geneva_indexer"
verifier_level = 3
hidden_variant = true
fake_contact_oracle_allowed = false

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "index_count"
type = "analytic_param_check"
path = "params.index_count"
expected = 4.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.2
severity = "major"
hard_gate = false

[[probes]]
id = "contact"
type = "contact_engagement"
required_pairs = ["driver:geneva"]
min_rms_force_N = 0.005
min_engagement_fraction = 0.002
adapter = "chrono_contact"
hard_gate = true
severity = "critical"
weight = 1.0

[[probes]]
id = "penetration_bound"
type = "swept_collision"
max_penetration_mm = 5.5
adapter = "chrono_contact"
hard_gate = true
severity = "critical"
weight = 0.4
ignored_pairs = ["driver:geneva"]

[[probes]]
id = "lockup"
type = "lockup"
input_port = "input_port"
output_port = "output_port"
min_output_motion_rad = 0.002
adapter = "chrono_contact"
hard_gate = true
severity = "critical"
weight = 0.4

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2
