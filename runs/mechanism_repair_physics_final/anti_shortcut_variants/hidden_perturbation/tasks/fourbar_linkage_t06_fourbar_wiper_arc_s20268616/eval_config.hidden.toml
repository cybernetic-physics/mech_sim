[feedback]
public_metrics = ["mobility.observed", "coupler_path.chamfer", "coupler_path.n_observed", "coupler_path.n_target", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["mobility", "ports", "trusted_asset_preflight"]

[mechanism_repair_physics]
family = "fourbar_linkage"
verifier_level = 2
hidden_variant = true
fake_contact_oracle_allowed = false

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 1
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port", "coupler_point"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[[probes]]
id = "coupler_path"
type = "path_trace_chamfer"
moving_frame = "coupler_point"
target_csv = "target_path_hidden.csv"
normalize = true
max_chamfer = 0.04
weight = 1.0
severity = "major"

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2
