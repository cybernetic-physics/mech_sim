[feedback]
public_metrics = ["ratio.observed", "ratio.expected", "torque.output_speed_observed_rad_s", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["torque.torque_ripple_pct", "trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["ports", "trusted_asset_preflight", "chrono_contact_smoke"]

[adapters.chrono_contact]
contact_model = "smc"
procedural_cycloidal_fallback = false
samples = 720
duration_s = 1.0
input_speed_rad_s = 1.0
output_load_Nm = 0.05

[mechanism_repair_physics]
family = "cycloidal_reducer"
verifier_level = 3
hidden_variant = true
fake_contact_oracle_allowed = false

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "ratio"
type = "analytic_param_check"
path = "params.declared_ratio"
expected = 11.0
comparator = "eq"
tolerance_pct = 1.0
failure_code = "wrong_ratio"
weight = 0.3
severity = "major"

[[probes]]
id = "torque"
type = "torque_load_trial"
input_port = "input_port"
output_port = "output_port"
input_speed_rad_s = 20.0
output_load_Nm = 0.1
min_output_speed_rad_s = 0.001
max_power_error_pct = 25.0
max_torque_ripple_pct = 30.0
weight = 0.7
severity = "critical"

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2

[[probes]]
id = "chrono_contact_smoke"
type = "contact_engagement"
required_pairs = ["housing:disc"]
min_rms_force_N = 0.1
min_engagement_fraction = 0.01
adapter = "chrono_contact"
hard_gate = true
severity = "critical"
weight = 0.5
