[feedback]
public_metrics = ["belt_length.observed", "center.observed", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["belt_length.error_pct", "trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["mobility", "ports", "trusted_asset_preflight"]

[mechanism_repair_physics]
family = "belt_drive"
verifier_level = 2
hidden_variant = false
fake_contact_oracle_allowed = false

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 2
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[[probes]]
id = "belt_length"
type = "analytic_param_check"
path = "params.declared_belt_length_mm"
expected = 600.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_pct = 2.0

[[probes]]
id = "center"
type = "analytic_param_check"
path = "params.declared_center_distance_mm"
expected = 280.0
comparator = "eq"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_pct = 2.0

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2
