[feedback]
public_metrics = ["mobility.observed", "ports.ports_required", "ratio.observed", "ratio.expected", "speed_ratio.ratio_observed", "speed_ratio.ratio_expected", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["ratio.error_pct", "speed_ratio.ratio_error_pct", "trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["mobility", "ports", "trusted_asset_preflight"]

[mechanism_repair_physics]
family = "belt_drive"
verifier_level = 2
hidden_variant = false
fake_contact_oracle_allowed = false

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 2
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
require_grounded = ["input_port", "output_port"]
hard_gate = true
severity = "critical"

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "ratio"
type = "analytic_param_check"
path = "params.declared_ratio"
expected = 1.5
comparator = "eq"
tolerance_pct = 2.0
failure_code = "wrong_ratio"
weight = 1.0
severity = "major"

[[probes]]
id = "speed_ratio"
type = "port_velocity_ratio"
input_port = "input_port"
output_port = "output_port"
expected = 0.6666666666666666
tolerance_pct = 2.0
min_abs_input_velocity = 1e-06
weight = 1.0
severity = "major"

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2
