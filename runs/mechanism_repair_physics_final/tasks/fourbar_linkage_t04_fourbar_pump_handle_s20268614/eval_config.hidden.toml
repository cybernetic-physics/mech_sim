[feedback]
public_metrics = ["min_range.observed", "max_range.observed", "trusted_asset_preflight.parts_with_required_geometry"]
hidden_metrics = ["trusted_asset_preflight.trusted_mass_properties_recomputed"]

[hard_gate]
require = ["mobility", "ports", "trusted_asset_preflight"]

[mechanism_repair_physics]
family = "fourbar_linkage"
verifier_level = 2
hidden_variant = true
fake_contact_oracle_allowed = false

[[probes]]
id = "mobility"
type = "dof_grubler"
space = "planar"
expected = 1
tolerance = 0
hard_gate = true
severity = "critical"

[[probes]]
id = "ports"
type = "required_ports"
ports = ["input_port", "output_port"]
hard_gate = true
severity = "critical"
require_grounded = ["input_port", "output_port"]

[probes.require_kinds]
input_port = "revolute_joint"
output_port = "revolute_joint"

[[probes]]
id = "min_range"
type = "analytic_param_check"
path = "params.output_rocker_min_rad"
expected = -0.785
comparator = "le"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_abs = 0.1

[[probes]]
id = "max_range"
type = "analytic_param_check"
path = "params.output_rocker_max_rad"
expected = 0.785
comparator = "ge"
failure_code = "wrong_ratio"
weight = 0.5
severity = "major"
hard_gate = false
tolerance_abs = 0.1

[[probes]]
id = "trusted_asset_preflight"
type = "trusted_asset_preflight"
require_geometry_roles = ["cad"]
require_materials = true
require_material_properties = ["density_kg_m3", "elastic_modulus_pa", "poisson_ratio", "yield_strength_pa"]
require_provenance = true
require_trusted_mass_properties = true
hard_gate = true
severity = "critical"
weight = 0.2
