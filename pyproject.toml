[project]
name = "mech-bench"
version = "0.1.0"
description = "Mechanical Design RLVR Benchmark Runtime"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
traces = ["h5py>=3.10"]
dashboard = ["plotly>=5.20"]
media = ["matplotlib>=3.8"]

[project.scripts]
mech-bench = "mech_bench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mech_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
