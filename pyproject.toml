[project]
name = "mech-bench"
version = "0.1.0"
description = "Mechanical Design RLVR Benchmark Runtime"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "autonomous-agents",
    "mechanical-design",
    "physics-simulation",
    "reinforcement-learning",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
traces = ["h5py>=3.10"]
dashboard = ["plotly>=5.20"]
media = ["matplotlib>=3.8"]
training-mlx = [
    "huggingface_hub>=0.31",
    "mlx-lm>=0.31",
]
training-grpo = [
    "accelerate>=1.8",
    "bitsandbytes>=0.46",
    "datasets>=3.6",
    "peft>=0.15",
    "torch==2.9.1",
    "transformers>=4.52",
    "trl>=0.17",
]

[project.scripts]
mech-bench = "mech_bench.__main__:main"

[project.urls]
Homepage = "https://github.com/cybernetic-physics/mech_sim"
Repository = "https://github.com/cybernetic-physics/mech_sim"
Issues = "https://github.com/cybernetic-physics/mech_sim/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mech_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
